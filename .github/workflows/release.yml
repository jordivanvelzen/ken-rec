name: release

# Push a tag such as v0.1.0 to publish a signed app on the Releases page.
# Run it by hand (Actions tab) to build a signed app without publishing it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEN_REC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ken-rec-release.jks"
          echo "KEN_REC_KEYSTORE=$RUNNER_TEMP/ken-rec-release.jks" >> "$GITHUB_ENV"
          echo "KEN_REC_KEY_ALIAS=kenrec" >> "$GITHUB_ENV"

      - name: Build the signed app
        env:
          KEN_REC_KEYSTORE_PASSWORD: ${{ secrets.KEN_REC_KEYSTORE_PASSWORD }}
          KEN_REC_KEY_PASSWORD: ${{ secrets.KEN_REC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the file and write its checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ken-rec-${GITHUB_REF_NAME}.apk"
          # The same file under a name that never changes, so a link to
          # releases/latest/download/ken-rec.apk always gets the newest version.
          cp app/build/outputs/apk/release/app-release.apk dist/ken-rec.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ken-rec
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ken Rec ${GITHUB_REF_NAME#v}" \
            --generate-notes
